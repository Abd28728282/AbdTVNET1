<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer" />
    <title>سديم تي في</title>
    
    <!-- مكتبة Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <!-- خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #07090e;
            color: #f3f4f6;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .sadeem-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            height: 100dvh;
            background-color: #07090e;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        @media (min-width: 481px) {
            .sadeem-container {
                height: 90vh;
                max-height: 850px;
                border-radius: 28px;
                border: 6px solid #1e293b;
            }
        }

        .sadeem-header {
            height: 60px;
            min-height: 60px;
            background: rgba(7,9,14,0.95);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            width: 100%;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        .sadeem-logo {
            font-size: 20px;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sadeem-logo span {
            color: #818cf8;
            font-size: 11px;
            background: rgba(129, 140, 248, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .app-screen {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            display: none;
            flex-direction: column;
            background: #07090e;
        }

        .app-screen.active {
            display: flex;
        }

        .hero-banner-box {
            padding: 16px;
            flex-shrink: 0;
        }

        .hero-banner {
            background: linear-gradient(135deg, #0284c7 0%, #4338ca 100%);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.3);
        }

        .hero-banner h1 {
            font-size: 18px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 6px;
        }

        .hero-banner p {
            font-size: 11px;
            color: #e0f2fe;
            margin-bottom: 16px;
        }

        .sadeem-btn {
            background: #fff;
            color: #0284c7;
            border: none;
            padding: 10px 22px;
            font-size: 12px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-box-container {
            padding: 0 16px 12px;
            flex-shrink: 0;
        }

        .search-input {
            width: 100%;
            background: #111827;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 11px 16px;
            color: #fff;
            font-size: 13px;
        }

        .section-title {
            padding: 0 16px;
            font-size: 14px;
            font-weight: 800;
            color: #f1f5f9;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title::before {
            content: '';
            width: 3px;
            height: 14px;
            background: #38bdf8;
            border-radius: 2px;
        }

        .horizontal-list {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 0 16px 15px;
        }

        .horizontal-list::-webkit-scrollbar { display: none; }

        .media-card {
            min-width: 120px;
            width: 120px;
            background: #111827;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .media-card img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            background: #05070b;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 8px;
        }

        .media-card span {
            font-size: 11px;
            font-weight: 700;
            color: #e2e8f0;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .player-wrapper {
            width: 100%;
            height: 250px;
            background: #000;
            position: relative;
            flex-shrink: 0;
        }

        .video-js {
            width: 100% !important;
            height: 100% !important;
        }

        .current-info-bar {
            padding: 12px 16px;
            background: #111827;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .current-info-bar img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            background: #05070b;
            border-radius: 10px;
            padding: 4px;
        }

        .channels-list-box {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .channel-row-item {
            background: #111827;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .channel-row-item.active {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border-color: #38bdf8;
        }

        .channel-row-item img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            background: #05070b;
            border-radius: 8px;
        }

        .channel-row-info h4 {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .channel-row-info span {
            font-size: 10px;
            color: #94a3b8;
        }

        .sadeem-bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: rgba(7, 9, 14, 0.98);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.08);
            z-index: 1000;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            flex: 1;
        }

        .nav-btn.active {
            color: #38bdf8;
        }

        .nav-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="sadeem-container">
        <div class="sadeem-header">
            <div class="sadeem-logo">سديم تي في <span>مباشر</span></div>
        </div>

        <!-- الرئيسية -->
        <div class="app-screen active" id="screenHome">
            <div class="hero-banner-box">
                <div class="hero-banner">
                    <h1>البث المباشر الفضائي</h1>
                    <p>تشغيل مباشر وسريع للقنوات العربية.</p>
                    <button class="sadeem-btn" onclick="navigateTo('screenPlayer', 0)">▶ ابدأ المشاهدة</button>
                </div>
            </div>
            <div id="homeCategoriesContainer" style="padding-bottom: 75px;">
                <div style="text-align: center; color: #94a3b8; padding: 40px; font-size: 13px;">جاري جلب قائمة القنوات...</div>
            </div>
        </div>

        <!-- المشغل -->
        <div class="app-screen" id="screenPlayer">
            <div class="player-wrapper">
                <video id="mainVideo" class="video-js vjs-default-skin vjs-big-play-centered" controls playsinline webkit-playsinline></video>
            </div>
            <div class="current-info-bar">
                <img id="currentLogo" src="https://via.placeholder.com/40" onerror="this.src='https://via.placeholder.com/40?text=TV'">
                <div>
                    <h3 id="currentTitle" style="font-size:13px; color:#fff;">اختر قناة</h3>
                    <span style="font-size:10px; color:#38bdf8;">بث حي</span>
                </div>
            </div>
            <div class="channels-list-box" id="channelsListBox" style="padding-bottom: 75px;"></div>
        </div>

        <!-- الدليل والبحث -->
        <div class="app-screen" id="screenChannels">
            <div class="search-box-container" style="padding-top: 15px;">
                <input type="text" class="search-input" placeholder="ابحث عن اسم القناة..." oninput="filterChannels(this.value)">
            </div>
            <div class="channels-list-box" id="fullChannelsListBox" style="padding-bottom: 75px;"></div>
        </div>

        <!-- التنقل السفلي -->
        <div class="sadeem-bottom-nav">
            <button class="nav-btn active" id="navHome" onclick="navigateTo('screenHome')">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>الرئيسية
            </button>
            <button class="nav-btn" id="navPlayer" onclick="navigateTo('screenPlayer')">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>المشغل
            </button>
            <button class="nav-btn" id="navChannels" onclick="navigateTo('screenChannels')">
                <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>الدليل
            </button>
        </div>
    </div>

    <script>
        let vjsPlayer = null;
        let channelsData = [];
        let groupedData = {};

        // بروكسي موثوق لتجاوز HTTPS و CORS على GitHub Pages
        const PROXY = "https://api.allorigins.win/raw?url=";

        function initVideoJS() {
            vjsPlayer = videojs('mainVideo', {
                controls: true,
                autoplay: false,
                preload: 'auto',
                fluid: false
            });
        }

        async function fetchChannels() {
            try {
                // رابط قائمة القنوات العربية المباشر
                const targetUrl = 'https://iptv-org.github.io/iptv/languages/ara.m3u';
                const fetchUrl = window.location.protocol === 'https:' ? PROXY + encodeURIComponent(targetUrl) : targetUrl;
                
                const res = await fetch(fetchUrl);
                const text = await res.text();
                parseM3U(text);
            } catch (e) {
                document.getElementById('homeCategoriesContainer').innerHTML = 
                    `<div style="text-align:center; padding:30px; color:#ef4444; font-size:12px;">حدث خطأ أثناء تحميل القنوات، أعد تحميل الصفحة.</div>`;
            }
        }

        function parseM3U(content) {
            const lines = content.split('\n');
            channelsData = [];
            groupedData = {};
            let current = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let nameMatch = line.match(/,(.+)$/);
                    let logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    let groupMatch = line.match(/group-title="([^"]+)"/);

                    current.name = nameMatch ? nameMatch[1].trim() : "قناة فضائية";
                    current.logo = logoMatch ? logoMatch[1] : "https://via.placeholder.com/40?text=TV";
                    current.group = groupMatch ? groupMatch[1] : "عامة";
                } else if (line && !line.startsWith('#')) {
                    current.url = line;
                    if (current.name && current.url) {
                        channelsData.push({ ...current });
                        if (!groupedData[current.group]) groupedData[current.group] = [];
                        groupedData[current.group].push({ ...current });
                    }
                    current = {};
                }
            }
            renderUI();
        }

        function renderUI() {
            const homeContainer = document.getElementById('homeCategoriesContainer');
            const playerList = document.getElementById('channelsListBox');
            const fullList = document.getElementById('fullChannelsListBox');

            homeContainer.innerHTML = '';
            playerList.innerHTML = '';
            fullList.innerHTML = '';

            // 1. القوائم الأفقية في الرئيسية
            for (const [group, list] of Object.entries(groupedData)) {
                let cardsHtml = '';
                list.forEach(ch => {
                    let index = channelsData.findIndex(c => c.url === ch.url);
                    cardsHtml += `
                        <div class="media-card" onclick="navigateTo('screenPlayer', ${index})">
                            <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/40?text=TV'">
                            <span>${ch.name}</span>
                        </div>
                    `;
                });

                homeContainer.innerHTML += `
                    <div style="margin-bottom:15px;">
                        <div class="section-title">${group}</div>
                        <div class="horizontal-list">${cardsHtml}</div>
                    </div>
                `;
            }

            // 2. القائمة العمودية في الشاشات الأخري
            channelsData.forEach((ch, idx) => {
                const row = document.createElement('div');
                row.className = 'channel-row-item';
                row.id = `ch-${idx}`;
                row.innerHTML = `
                    <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/40?text=TV'">
                    <div class="channel-row-info">
                        <h4>${ch.name}</h4>
                        <span>${ch.group}</span>
                    </div>
                `;
                row.onclick = () => navigateTo('screenPlayer', idx);

                playerList.appendChild(row);
                fullList.appendChild(row.cloneNode(true));
            });
        }

        function playChannel(index) {
            const ch = channelsData[index];
            if (!ch || !vjsPlayer) return;

            document.getElementById('currentTitle').textContent = ch.name;
            document.getElementById('currentLogo').src = ch.logo;

            let playUrl = ch.url;
            // معالجة تشغيل الروابط غير الآمنة عبر البروكسي
            if (window.location.protocol === 'https:' && playUrl.startsWith('http://')) {
                playUrl = "https://corsproxy.io/?" + encodeURIComponent(playUrl);
            }

            vjsPlayer.src({
                src: playUrl,
                type: 'application/x-mpegURL'
            });

            vjsPlayer.ready(() => {
                vjsPlayer.play().catch(() => {
                    vjsPlayer.muted(true);
                    vjsPlayer.play();
                });
            });
        }

        function navigateTo(screenId, index = null) {
            ['screenHome', 'screenPlayer', 'screenChannels'].forEach(s => document.getElementById(s).classList.remove('active'));
            ['navHome', 'navPlayer', 'navChannels'].forEach(n => document.getElementById(n).classList.remove('active'));

            document.getElementById(screenId).classList.add('active');
            
            if (screenId === 'screenHome') document.getElementById('navHome').classList.add('active');
            if (screenId === 'screenPlayer') {
                document.getElementById('navPlayer').classList.add('active');
                if (index !== null) playChannel(index);
            }
            if (screenId === 'screenChannels') document.getElementById('navChannels').classList.add('active');
        }

        function filterChannels(q) {
            const term = q.toLowerCase();
            const rows = document.querySelectorAll('#fullChannelsListBox .channel-row-item');
            rows.forEach(row => {
                const txt = row.textContent.toLowerCase();
                row.style.display = txt.includes(term) ? 'flex' : 'none';
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initVideoJS();
            fetchChannels();
        });
    </script>
</body>
</html>
