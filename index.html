<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abd TV | المنصة الاحترافية الشاملة</title>
    <!-- مكتبة HLS.js للتشغيل الفائق -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.light.min.js"></script>
    <!-- مكتبة مشغل الفيديو الأسطوري Plyr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
    <!-- خط Cairo العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* شريط التنقل العلوي */
        header {
            width: 100%;
            height: 70px;
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .logo span {
            background: #ef4444;
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .header-search {
            width: 300px;
        }

        #globalSearch {
            width: 100%;
            padding: 9px 14px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
        }

        #globalSearch:focus {
            border-color: #38bdf8;
        }

        /* الصفحة الرئيسية ذات الأقسام المنظمة */
        .home-page {
            padding-top: 90px;
            padding-bottom: 50px;
            display: block;
        }

        .home-page.hidden {
            display: none;
        }

        .hero-banner {
            margin: 0 30px 40px;
            padding: 50px;
            background: linear-gradient(135deg, #111827 0%, #161e2e 100%);
            border: 1px solid #1f2937;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .hero-banner h1 {
            font-size: 36px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
        }

        .hero-banner p {
            font-size: 15px;
            color: #9ca3af;
            margin-bottom: 25px;
            max-width: 600px;
        }

        .start-btn {
            background-color: #0284c7;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .start-btn:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
        }

        /* تنسيق أقسام القنوات الأفقية */
        .category-section {
            margin-bottom: 35px;
            padding: 0 30px;
        }

        .category-title {
            font-size: 18px;
            font-weight: 800;
            color: #f9fafb;
            margin-bottom: 15px;
            border-right: 4px solid #38bdf8;
            padding-right: 10px;
        }

        .channels-slider {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            scroll-behavior: smooth;
        }

        .channels-slider::-webkit-scrollbar {
            height: 6px;
        }
        .channels-slider::-webkit-scrollbar-track {
            background: #111827;
        }
        .channels-slider::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }

        .channel-card {
            min-width: 180px;
            height: 120px;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .channel-card:hover {
            background-color: #1f2937;
            border-color: #38bdf8;
            transform: translateY(-4px);
        }

        .channel-card img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            margin-bottom: 8px;
            background: #0b0f19;
            border-radius: 6px;
            padding: 3px;
            border: 1px solid #374151;
        }

        .channel-card span {
            font-size: 13px;
            font-weight: 700;
            color: #e2e8f0;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* صفحة العرض والمشغل (تظهر عند اختيار قناة أو بدء المشاهدة) */
        .player-page {
            display: none;
            height: calc(100vh - 70px);
            margin-top: 70px;
            padding: 20px;
            gap: 20px;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
        }

        .player-page.active {
            display: flex;
        }

        .player-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-box {
            width: 100%;
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        :root {
            --plyr-color-main: #38bdf8;
            --plyr-video-background: #000;
        }

        video {
            width: 100%;
            height: 100%;
        }

        .player-info-bar {
            padding: 16px 20px;
            background-color: #161e2e;
            border-top: 1px solid #1f2937;
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-home-btn {
            background: #374151;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .back-home-btn:hover {
            background: #4b5563;
        }

        /* قائمة القنوات الجانبية */
        .channels-sidebar {
            width: 380px;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-search-box {
            padding: 16px;
            border-bottom: 1px solid #1f2937;
            background-color: #161e2e;
        }

        #sidebarSearch {
            width: 100%;
            padding: 10px 14px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
        }

        .channels-scroll-list {
            overflow-y: auto;
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .channel-row-item {
            background-color: #161e2e;
            border: 1px solid #1f2937;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .channel-row-item:hover {
            background-color: #1f2937;
        }

        .channel-row-item.active {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border-color: #38bdf8;
        }

        .channel-row-item img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            background: #0b0f19;
            border-radius: 6px;
            padding: 3px;
            border: 1px solid #374151;
            flex-shrink: 0;
        }

        .channel-details {
            overflow: hidden;
            flex: 1;
        }

        .channel-title-text {
            font-size: 13px;
            font-weight: 700;
            color: #f9fafb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .channel-group-tag {
            font-size: 10px;
            color: #9ca3af;
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        @media (max-width: 900px) {
            .player-page {
                flex-direction: column;
                height: auto;
            }
            .player-section { height: 350px; }
            .channels-sidebar { height: 400px; }
        }
    </style>
</head>
<body>

    <!-- شريط التنقل -->
    <header>
        <div class="logo" onclick="goHome()">
            Abd TV <span>مباشر</span>
        </div>
        <div class="header-search">
            <input type="text" id="globalSearch" placeholder="بحث عام عن القنوات..." onkeyup="filterGlobalChannels()">
        </div>
    </header>

    <!-- الصفحة الرئيسية للأقسام -->
    <div class="home-page" id="homePage">
        <div class="hero-banner">
            <h1>منصة Abd TV الرقمية</h1>
            <p>استمتع بمئات القنوات العربية المرتبة بأحدث التصميمات والسرعة الصاروخية المطلقة.</p>
            <button class="start-btn" onclick="openPlayerMode(0)">▶ ابدأ المشاهدة الآن</button>
        </div>
        <div id="categoriesContainer">
            <div style="text-align: center; color: #9ca3af; padding: 40px;">جاري تحميل الأقسام والقنوات...</div>
        </div>
    </div>

    <!-- صفحة المشغل والقنوات الجانبية -->
    <div class="player-page" id="playerPage">
        <div class="player-section">
            <div class="video-box">
                <video id="player" controls playsinline></video>
            </div>
            <div class="player-info-bar">
                <span id="currentChannelDisplay">جاري التشغيل...</span>
                <button class="back-home-btn" onclick="goHome()">الرئيسية والأقسام ⌂</button>
            </div>
        </div>

        <div class="channels-sidebar">
            <div class="sidebar-search-box">
                <input type="text" id="sidebarSearch" placeholder="ابحث في القنوات..." onkeyup="filterSidebarChannels()">
            </div>
            <div class="channels-scroll-list" id="sidebarChannelsList"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('player');
        const homePage = document.getElementById('homePage');
        const playerPage = document.getElementById('playerPage');
        const categoriesContainer = document.getElementById('categoriesContainer');
        const sidebarChannelsList = document.getElementById('sidebarChannelsList');
        const currentChannelDisplay = document.getElementById('currentChannelDisplay');

        let hls = null;
        let allChannelsList = [];
        let groupedChannels = {};

        const player = new Plyr(video, {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
            fullscreen: { enabled: true, fallback: true, iosNative: true }
        });

        async function fetchChannels() {
            try {
                const response = await fetch('https://iptv-org.github.io/iptv/languages/ara.m3u');
                const data = await response.text();
                parseData(data);
            } catch (error) {
                categoriesContainer.innerHTML = `<div style="text-align: center; color: #ef4444; padding: 30px;">فشل تحميل القنوات.</div>`;
            }
        }

        function parseData(m3uContent) {
            const lines = m3uContent.split('\n');
            allChannelsList = [];
            groupedChannels = {};
            let current = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let nameMatch = line.match(/,(.+)$/);
                    let logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    let groupMatch = line.match(/group-title="([^"]+)"/);
                    
                    current.name = nameMatch ? nameMatch[1].trim() : "قناة عامة";
                    current.logo = logoMatch ? logoMatch[1] : "https://via.placeholder.com/45?text=TV";
                    current.group = groupMatch ? groupMatch[1] : "عامة";
                } else if (line && !line.startsWith('#')) {
                    current.url = line;
                    if (current.name && current.url) {
                        allChannelsList.push({ ...current });
                        if (!groupedChannels[current.group]) {
                            groupedChannels[current.group] = [];
                        }
                        groupedChannels[current.group].push({ ...current });
                    }
                    current = {};
                }
            }
            renderHomeCategories(groupedChannels);
            renderSidebarList(allChannelsList);
        }

        function renderHomeCategories(groups) {
            categoriesContainer.innerHTML = '';
            for (const [groupName, channels] of Object.entries(groups)) {
                let cardsHtml = '';
                channels.forEach(channel => {
                    let globalIdx = allChannelsList.findIndex(c => c.url === channel.url);
                    cardsHtml += `
                        <div class="channel-card" onclick="openPlayerMode(${globalIdx})">
                            <img src="${channel.logo}" onerror="this.src='https://via.placeholder.com/45?text=TV'">
                            <span title="${channel.name}">${channel.name}</span>
                        </div>
                    `;
                });

                const section = document.createElement('div');
                section.className = 'category-section';
                section.innerHTML = `
                    <div class="category-title">${groupName}</div>
                    <div class="channels-slider">${cardsHtml}</div>
                `;
                categoriesContainer.appendChild(section);
            }
        }

        function renderSidebarList(channels) {
            sidebarChannelsList.innerHTML = '';
            const fragment = document.createDocumentFragment();
            channels.forEach((channel) => {
                let globalIdx = allChannelsList.findIndex(c => c.url === channel.url);
                const item = document.createElement('div');
                item.className = 'channel-row-item';
                item.id = `sidebar-item-${globalIdx}`;
                item.innerHTML = `
                    <img src="${channel.logo}" onerror="this.src='https://via.placeholder.com/40?text=TV'">
                    <div class="channel-details">
                        <div class="channel-title-text" title="${channel.name}">${channel.name}</div>
                        <div class="channel-group-tag">${channel.group}</div>
                    </div>
                `;
                item.onclick = () => playStream(globalIdx);
                fragment.appendChild(item);
            });
            sidebarChannelsList.appendChild(fragment);
        }

        function openPlayerMode(index) {
            homePage.classList.add('hidden');
            playerPage.classList.add('active');
            playStream(index);
        }

        function goHome() {
            playerPage.classList.remove('active');
            homePage.classList.remove('hidden');
            player.pause();
            if (hls) {
                hls.destroy();
                hls = null;
            }
        }

        function playStream(index) {
            const channel = allChannelsList[index];
            if (!channel) return;

            document.querySelectorAll('.channel-row-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`sidebar-item-${index}`);
            if (activeEl) activeEl.classList.add('active');

            currentChannelDisplay.textContent = "يعرض الآن: " + channel.name;

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({
                    maxBufferLength: 10,
                    maxMaxBufferLength: 20,
                    liveSyncDurationCount: 1.5,
                    enableWorker: true
                });
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    player.play().catch(e => console.log("Autoplay restricted"));
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
                            case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                            default: hls.destroy(); break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                player.play();
            }
        }

        function filterGlobalChannels() {
            let query = document.getElementById('globalSearch').value.toLowerCase();
            if (!query) {
                renderHomeCategories(groupedChannels);
                return;
            }
            let filteredGroups = {};
            for (const [groupName, channels] of Object.entries(groupedChannels)) {
                let matches = channels.filter(c => c.name.toLowerCase().includes(query));
                if (matches.length > 0) filteredGroups[groupName] = matches;
            }
            renderHomeCategories(filteredGroups);
        }

        function filterSidebarChannels() {
            let query = document.getElementById('sidebarSearch').value.toLowerCase();
            let filtered = allChannelsList.filter(c => c.name.toLowerCase().includes(query) || c.group.toLowerCase().includes(query));
            renderSidebarList(filtered);
        }

        fetchChannels();
    </script>
</body>
</html>
