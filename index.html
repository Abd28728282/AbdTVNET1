<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر - إذاعة وقناة القرآن الكريم</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 56.25%; /* نسبة العرض للارتفاع 16:9 */
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <h2>بث مباشر لقناة القرآن الكريم من مكة المكرمة</h2>
    
    <div class="video-container">
        <!-- استبدل معرف الفيديو (VIDEO_ID) برابط البث الرسمي المتاح لديك على يوتيوب -->
        <iframe src="https://www.youtube.com/embed/live_stream?channel=UC5u3... (معرف القناة أو الفيديو)" 
                title="Quran Live Stream" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
    </div>

</body>
</html>
