<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abd TV | التطبيق الرسمي</title>
    <!-- مكتبة HLS.js للتشغيل الفائق -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.light.min.js"></script>
    <!-- خط Cairo العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #05070b;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* حاوية الهاتف الأساسية (عند ملء الشاشة ستتمدد بشكل فخم تحافظ على كل التصميم) */
        .mobile-frame {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: #0b0f19;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        /* إذا دخلت الحاوية في وضع ملء الشاشة، تجعل الخلفية سوداء سينمائية وتوسّط المحتوى */
        .mobile-frame:fullscreen {
            max-width: 100% !important;
            height: 100vh !important;
            border-radius: 0 !important;
            border: none !important;
            background-color: #0b0f19;
        }
        .mobile-frame:-webkit-full-screen {
            max-width: 100% !important;
            height: 100vh !important;
            border-radius: 0 !important;
            border: none !important;
            background-color: #0b0f19;
        }

        @media (min-width: 481px) {
            .mobile-frame {
                height: 90vh;
                max-height: 850px;
                border-radius: 36px;
                border: 8px solid #1f2937;
            }
        }

        /* شريط علوي أنيق */
        .mobile-header {
            height: 60px;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo span {
            background: #ef4444;
            color: #fff;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* صفحات التطبيق */
        .screen {
            position: absolute;
            top: 60px;
            bottom: 70px;
            left: 0;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            opacity: 1;
        }

        .screen.hidden-left {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .screen.hidden-right {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }

        /* شاشة البداية */
        .hero-banner-mobile {
            margin: 15px;
            padding: 30px 20px;
            background: linear-gradient(135deg, #0284c7 0%, #0f172a 100%);
            border-radius: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.3);
        }

        .hero-banner-mobile h1 {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 8px;
        }

        .hero-banner-mobile p {
            font-size: 12px;
            color: #e0f2fe;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .pulse-btn {
            background: #fff;
            color: #0284c7;
            border: none;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(255, 255, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* الأقسام الأفقية */
        .category-block {
            margin-bottom: 25px;
        }

        .category-header {
            padding: 0 15px;
            font-size: 15px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-header::before {
            content: '';
            width: 4px;
            height: 16px;
            background: #38bdf8;
            border-radius: 2px;
        }

        .horizontal-scroller {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 0 15px 5px;
            scroll-behavior: smooth;
        }

        .horizontal-scroller::-webkit-scrollbar {
            display: none;
        }

        .channel-card-mob {
            min-width: 130px;
            width: 130px;
            height: 100px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .channel-card-mob:active {
            transform: scale(0.92);
            background: #1f2937;
        }

        .channel-card-mob img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            margin-bottom: 6px;
            background: #05070b;
            border-radius: 8px;
            padding: 3px;
        }

        .channel-card-mob span {
            font-size: 11px;
            font-weight: 700;
            color: #e2e8f0;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* شاشة المشغل الخاص والنظيف */
        .player-screen {
            display: flex;
            flex-direction: column;
        }

        .mobile-video-container {
            width: 100%;
            height: 240px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* في وضع ملء الشاشة للحاوية، نكبر مساحة المشغل لتملاء الشاشة بانسجام */
        .mobile-frame:fullscreen .mobile-video-container {
            height: 45vh;
        }
        .mobile-frame:-webkit-full-screen .mobile-video-container {
            height: 45vh;
        }

        .mobile-video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* لوحة التحكم الخاصة بالمشغل */
        .custom-video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(5,7,11,0.95), rgba(5,7,11,0.4), transparent);
            padding: 20px 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .mobile-video-container:hover .custom-video-controls,
        .mobile-video-container.touch-active .custom-video-controls {
            opacity: 1;
            pointer-events: auto;
        }

        /* شريط التخزين المؤقت والتقدم (Seekbar & Buffer Bar) من اليسار لليمين تماماً */
        .seekbar-wrapper {
            position: relative;
            width: 100%;
            height: 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            direction: ltr; /* لضمان التعبئة تبدأ من اليسار إلى اليمين */
        }

        .seekbar-bg {
            position: absolute;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        /* شريط التخزين المؤقت (Buffer Bar) يبدأ من اليسار */
        .buffer-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            width: 0%;
            border-radius: 3px;
            transition: width 0.2s ease;
        }

        /* شريط التقدم الفعلي يبدأ من اليسار إلى اليمين */
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #38bdf8;
            width: 0%;
            border-radius: 3px;
        }

        /* كرة التحكم بالسحب على الشريط */
        .seekbar-thumb {
            position: absolute;
            left: 0%;
            width: 11px;
            height: 11px;
            background: #fff;
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 6px rgba(0,0,0,0.5);
        }

        /* أزرار التحكم السفلية داخل المشغل */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-group-right, .controls-group-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background 0.2s, transform 0.1s;
        }

        .ctrl-btn:active {
            background: rgba(56, 189, 248, 0.4);
            transform: scale(0.9);
        }

        .ctrl-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .time-display {
            font-size: 10px;
            color: #cbd5e1;
            font-weight: 600;
            direction: ltr;
        }

        .current-playing-card {
            padding: 15px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .current-playing-card img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            background: #05070b;
            border-radius: 10px;
            padding: 4px;
        }

        .current-details h3 {
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 2px;
        }

        .current-details span {
            font-size: 11px;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
        }

        /* قائمة القنوات العمودية */
        .vertical-playlist {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* في وضع ملء الشاشة للحاوية، نمنح القائمة مساحة أكبر للتصفح */
        .mobile-frame:fullscreen .vertical-playlist {
            max-height: calc(55vh - 70px);
        }
        .mobile-frame:-webkit-full-screen .vertical-playlist {
            max-height: calc(55vh - 70px);
        }

        .playlist-item {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .playlist-item:active {
            transform: scale(0.97);
        }

        .playlist-item.active {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border-color: #38bdf8;
        }

        .playlist-item img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            background: #05070b;
            border-radius: 8px;
            padding: 2px;
        }

        .playlist-item-info {
            flex: 1;
            overflow: hidden;
        }

        .playlist-item-info h4 {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-info span {
            font-size: 9px;
            color: #9ca3af;
        }
        .playlist-item.active .playlist-item-info span {
            color: #e0f2fe;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.06);
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: #6b7280;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-item.active {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- حاوية الهاتف الأساسية (التي ستدخل بالكامل في وضع ملء الشاشة) -->
    <div class="mobile-frame" id="mobileFrame">
        
        <!-- شريط علوي -->
        <div class="mobile-header">
            <div class="logo">
                Abd TV <span>PRO</span>
            </div>
        </div>

        <!-- الرئيسية -->
        <div class="screen" id="homeScreen">
            <div class="hero-banner-mobile">
                <h1>عالم البث الحي</h1>
                <p>قنواتك المفضلة بتصميم جوال صاروخي وسريع جداً.</p>
                <button class="pulse-btn" onclick="switchScreen('playerScreen', 0)">▶ ابدأ المشاهدة الآن</button>
            </div>
            
            <div id="mobileCategoriesContainer">
                <div style="text-align: center; color: #9ca3af; padding: 40px; font-size: 13px;">جاري جلب الأقسام...</div>
            </div>
        </div>

        <!-- المشغل الخاص والنظيف -->
        <div class="screen hidden-right player-screen" id="playerScreen">
            <div class="mobile-video-container" id="videoContainer" onclick="toggleControls()">
                <video id="customVideo" playsinline webkit-playsinline></video>
                
                <!-- لوحة التحكم الاحترافية مع SeekBar من اليسار لليمين -->
                <div class="custom-video-controls" id="videoControls">
                    
                    <!-- شريط التقدم والتخزين المؤقت (من اليسار لليمين) -->
                    <div class="seekbar-wrapper" id="seekbarWrapper">
                        <div class="seekbar-bg">
                            <div class="buffer-bar" id="bufferBar"></div>
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                        <div class="seekbar-thumb" id="seekbarThumb"></div>
                    </div>

                    <!-- أزرار التحكم -->
                    <div class="controls-row">
                        <div class="controls-group-right">
                            <!-- زر التشغيل / الإيقاف -->
                            <button class="ctrl-btn" id="playPauseBtn" onclick="togglePlayPause(event)">
                                <svg id="playPauseIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                            </button>
                            <!-- زر كتم الصوت -->
                            <button class="ctrl-btn" onclick="toggleMute(event)">
                                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            </button>
                            <span class="time-display" id="timeDisplay">بث مباشر</span>
                        </div>

                        <div class="controls-group-left">
                            <!-- زر ملء الشاشة (يكبر الحاوية بالكامل ليحافظ على التصميم) -->
                            <button class="ctrl-btn" onclick="toggleFullscreen(event)">
                                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="current-playing-card">
                <img id="currentLogo" src="https://via.placeholder.com/40" onerror="this.src='https://via.placeholder.com/40?text=TV'">
                <div class="current-details">
                    <h3 id="currentName">اختر قناة</h3>
                    <span>بث مباشر فائق السرعة</span>
                </div>
            </div>

            <div class="vertical-playlist" id="verticalPlaylist">
                <!-- القنوات -->
            </div>
        </div>

        <!-- التنقل السفلي -->
        <div class="bottom-nav">
            <button class="nav-item active" id="navHomeBtn" onclick="switchScreen('homeScreen')">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                الرئيسية
            </button>
            <button class="nav-item" id="navPlayerBtn" onclick="switchScreen('playerScreen')">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                المشغل
            </button>
        </div>

    </div>

    <script>
        const video = document.getElementById('customVideo');
        const videoContainer = document.getElementById('videoContainer');
        const mobileFrame = document.getElementById('mobileFrame');
        const playPauseIcon = document.getElementById('playPauseIcon');
        const progressBar = document.getElementById('progressBar');
        const bufferBar = document.getElementById('bufferBar');
        const seekbarThumb = document.getElementById('seekbarThumb');
        const timeDisplay = document.getElementById('timeDisplay');
        
        const homeScreen = document.getElementById('homeScreen');
        const playerScreen = document.getElementById('playerScreen');
        const mobileCategoriesContainer = document.getElementById('mobileCategoriesContainer');
        const verticalPlaylist = document.getElementById('verticalPlaylist');
        const currentName = document.getElementById('currentName');
        const currentLogo = document.getElementById('currentLogo');
        const navHomeBtn = document.getElementById('navHomeBtn');
        const navPlayerBtn = document.getElementById('navPlayerBtn');

        let hls = null;
        let channelsData = [];
        let groupedData = {};

        function switchScreen(screenId, targetChannelIndex = null) {
            if (screenId === 'homeScreen') {
                homeScreen.className = 'screen';
                playerScreen.className = 'screen hidden-right player-screen';
                navHomeBtn.classList.add('active');
                navPlayerBtn.classList.remove('active');
            } else {
                homeScreen.className = 'screen hidden-left';
                playerScreen.className = 'screen player-screen';
                navHomeBtn.classList.remove('active');
                navPlayerBtn.classList.add('active');

                if (targetChannelIndex !== null && channelsData.length > 0) {
                    playChannel(targetChannelIndex);
                } else if (!video.src && channelsData.length > 0) {
                    playChannel(0);
                }
            }
        }

        async function loadChannels() {
            try {
                const res = await fetch('https://iptv-org.github.io/iptv/languages/ara.m3u');
                const text = await res.text();
                parseM3U(text);
            } catch (e) {
                mobileCategoriesContainer.innerHTML = `<div style="text-align:center; color:#ef4444; padding:20px;">فشل الاتصال بمصادر البث</div>`;
            }
        }

        function parseM3U(content) {
            const lines = content.split('\n');
            channelsData = [];
            groupedData = {};
            let item = {};

            for (let i = 0; i < lines.length; i++) {
                let l = lines[i].trim();
                if (l.startsWith('#EXTINF:')) {
                    let nameM = l.match(/,(.+)$/);
                    let logoM = l.match(/tvg-logo="([^"]+)"/);
                    let groupM = l.match(/group-title="([^"]+)"/);
                    
                    item.name = nameM ? nameM[1].trim() : "قناة عامة";
                    item.logo = logoM ? logoM[1] : "https://via.placeholder.com/40?text=TV";
                    item.group = groupM ? groupM[1] : "منوعة";
                } else if (l && !l.startsWith('#')) {
                    item.url = l;
                    if (item.name && item.url) {
                        channelsData.push({ ...item });
                        if (!groupedData[item.group]) groupedData[item.group] = [];
                        groupedData[item.group].push({ ...item });
                    }
                    item = {};
                }
            }
            renderUI();
        }

        function renderUI() {
            mobileCategoriesContainer.innerHTML = '';
            verticalPlaylist.innerHTML = '';

            for (const [group, list] of Object.entries(groupedData)) {
                let cards = '';
                list.forEach(ch => {
                    let globalIdx = channelsData.findIndex(c => c.url === ch.url);
                    cards += `
                        <div class="channel-card-mob" onclick="switchScreen('playerScreen', ${globalIdx})">
                            <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/40?text=TV'">
                            <span title="${ch.name}">${ch.name}</span>
                        </div>
                    `;
                });

                const block = document.createElement('div');
                block.className = 'category-block';
                block.innerHTML = `
                    <div class="category-header">${group}</div>
                    <div class="horizontal-scroller">${cards}</div>
                `;
                mobileCategoriesContainer.appendChild(block);
            }

            const frag = document.createDocumentFragment();
            channelsData.forEach((ch, idx) => {
                const row = document.createElement('div');
                row.className = 'playlist-item';
                row.id = `playlist-row-${idx}`;
                row.innerHTML = `
                    <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/40?text=TV'">
                    <div class="playlist-item-info">
                        <h4>${ch.name}</h4>
                        <span>${ch.group}</span>
                    </div>
                `;
                row.onclick = () => playChannel(idx);
                frag.appendChild(row);
            });
            verticalPlaylist.appendChild(frag);
        }

        function playChannel(index) {
            const ch = channelsData[index];
            if (!ch) return;

            document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
            const activeRow = document.getElementById(`playlist-row-${index}`);
            if (activeRow) {
                activeRow.classList.add('active');
                activeRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            currentName.textContent = ch.name;
            currentLogo.src = ch.logo;

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({
                    maxBufferLength: 8,
                    maxMaxBufferLength: 15,
                    liveSyncDurationCount: 1.2,
                    enableWorker: true
                });
                hls.loadSource(ch.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay restricted"));
                    updatePlayPauseIcon(true);
                });
                hls.on(Hls.Events.ERROR, function(evt, data) {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
                            case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                            default: hls.destroy(); break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.play();
                updatePlayPauseIcon(true);
            }
        }

        // تحديث شريط التقدم والتخزين المؤقت (من اليسار لليمين)
        video.addEventListener('timeupdate', () => {
            if (!video.duration) return;
            const current = video.currentTime;
            const duration = video.duration;
            const percent = (current / duration) * 100;
            
            progressBar.style.width = percent + '%';
            seekbarThumb.style.left = percent + '%';

            let m = Math.floor(current / 60);
            let s = Math.floor(current % 60);
            timeDisplay.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
        });

        video.addEventListener('progress', () => {
            if (video.buffered.length > 0 && video.duration > 0) {
                const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                const bufferPercent = (bufferedEnd / video.duration) * 100;
                bufferBar.style.width = bufferPercent + '%';
            }
        });

        function togglePlayPause(e) {
            e.stopPropagation();
            if (video.paused) {
                video.play();
                updatePlayPauseIcon(true);
            } else {
                video.pause();
                updatePlayPauseIcon(false);
            }
        }

        function updatePlayPauseIcon(isPlaying) {
            if (isPlaying) {
                playPauseIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else {
                playPauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        }

        function toggleMute(e) {
            e.stopPropagation();
            video.muted = !video.muted;
        }

        // تفعيل وضع ملء الشاشة للحاوية كاملة ليبقى التصميم الأسطوري والمشغل مظبوطين تماماً
        function toggleFullscreen(e) {
            e.stopPropagation();
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (mobileFrame.requestFullscreen) {
                    mobileFrame.requestFullscreen();
                } else if (mobileFrame.webkitRequestFullscreen) {
                    mobileFrame.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        let controlsTimeout;
        function toggleControls() {
            videoContainer.classList.toggle('touch-active');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                videoContainer.classList.remove('touch-active');
            }, 3500);
        }

        loadChannels();
    </script>
</body>
</html>
