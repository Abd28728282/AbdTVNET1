<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد روابط مشغل البث | AbdTVNET</title>
    <!-- Tailwind CSS للتصميم السريع والمتجاوب -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- خط Cairo العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet5" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
        .glass-effect {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-effect {
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.25);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-950 via-slate-900 to-indigo-950 min-h-screen text-white flex items-center justify-center p-4">

    <div class="w-full max-w-xl mx-auto">
        <!-- الهيدر أو الشعار -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600/20 text-blue-400 rounded-2xl mb-4 border border-blue-500/30 shadow-inner">
                <i class="fa-solid fa-tv text-2xl"></i>
            </div>
            <h1 class="text-3xl font-black tracking-wide bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">
                مولد روابط AbdTVNET
            </h1>
            <p class="text-gray-400 text-sm mt-2">أنشئ رابط تشغيل البث الخاص بك بضغطة زر واحدة وبشكل احترافي</p>
        </div>

        <!-- صندوق الأدوات الرئيسي -->
        <div class="glass-effect rounded-3xl p-6 sm:p-8 glow-effect shadow-2xl">
            <!-- حقل إدخال الرابط -->
            <div class="mb-6">
                <label for="streamUrl" class="block text-sm font-semibold text-gray-300 mb-2">
                    <i class="fa-solid fa-link text-blue-400 ml-1"></i> رابط البث الأصلي (M3U8 / MP4 / إلخ)
                </label>
                <div class="relative">
                    <input type="url" id="streamUrl" 
                        placeholder="مثال: https://example.com/stream/playlist.m3u8"
                        class="w-full bg-slate-900/90 border border-slate-700 rounded-xl py-3.5 pr-4 pl-12 text-sm text-gray-100 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
                        <i class="fa-solid fa-globe"></i>
                    </span>
                </div>
            </div>

            <!-- زر التوليد -->
            <button onclick="generateLink()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 px-6 rounded-xl transition-all duration-300 shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 group cursor-pointer">
                <i class="fa-solid fa-wand-magic-sparkles group-hover:rotate-12 transition-transform"></i>
                توليد رابط المشغل السحري
            </button>

            <!-- صندوق النتيجة (يظهر بعد التوليد) -->
            <div id="resultContainer" class="mt-8 hidden opacity-0 transition-opacity duration-500">
                <div class="border-t border-slate-800 pt-6">
                    <label class="block text-sm font-semibold text-gray-300 mb-2">
                        <i class="fa-solid fa-square-check text-emerald-400 ml-1"></i> الرابط الناتج جاهز للاستخدام:
                    </label>
                    <div class="bg-slate-950/80 border border-slate-800 rounded-xl p-3 flex items-center justify-between gap-2">
                        <input type="text" id="finalOutput" readonly 
                            class="bg-transparent text-xs text-blue-300 w-full focus:outline-none select-all font-mono truncate" />
                    </div>

                    <!-- أزرار التفاعل (نسخ ومعاينة) -->
                    <div class="grid grid-cols-2 gap-3 mt-4">
                        <button onclick="copyLink()" id="copyBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20 cursor-pointer">
                            <i class="fa-regular fa-copy"></i>
                            <span id="copyText">نسخ الرابط</span>
                        </button>
                        <a id="previewBtn" href="#" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2 border border-slate-700">
                            <i class="fa-solid fa-play text-xs"></i>
                            معاينة البث
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- تذييل الصفحة -->
        <div class="text-center mt-6 text-xs text-slate-500">
            تم التطوير خصيصاً لتشغيل وسائط البث المباشر بجودة عالية &copy; AbdTVNET
        </div>
    </div>

    <!-- كود الجافاسكريبت للتشغيل التفاعلي -->
    <script>
        function generateLink() {
            const inputVal = document.getElementById('streamUrl').value.trim();
            const resultContainer = document.getElementById('resultContainer');
            const finalOutput = document.getElementById('finalOutput');
            const previewBtn = document.getElementById('previewBtn');

            if (!inputVal) {
                alert('الرجاء إدخال رابط البث أولاً!');
                return;
            }

            // دمج الرابط الأساسي مع المدخل المشفر
            const baseUrl = "https://abd28728282.github.io/AbdTVNET/?src=";
            const fullLink = baseUrl + encodeURIComponent(inputVal);

            // إظهار النتائج وتعبئتها
            finalOutput.value = fullLink;
            previewBtn.href = fullLink;
            
            resultContainer.classList.remove('hidden');
            setTimeout(() => {
                resultContainer.classList.remove('opacity-0');
            }, 50);
        }

        function copyLink() {
            const finalOutput = document.getElementById('finalOutput');
            const copyText = document.getElementById('copyText');
            const copyBtn = document.getElementById('copyBtn');

            finalOutput.select();
            finalOutput.setSelectionRange(0, 99999); // للأجهزة الذكية

            navigator.clipboard.writeText(finalOutput.value).then(() => {
                copyText.textContent = "تم النسخ بنجاح!";
                copyBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
                copyBtn.classList.add('bg-blue-600');

                setTimeout(() => {
                    copyText.textContent = "نسخ الرابط";
                    copyBtn.classList.remove('bg-blue-600');
                    copyBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
                }, 2000);
            }).catch(err => {
                alert('حدث خطأ أثناء النسخ');
            });
        }
    </script>
</body>
</html>
