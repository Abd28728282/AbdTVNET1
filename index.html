        :root {

            --card-bg: #1e293b;

            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        *, *::before, *::after {

            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border-bottom: 2px solid var(--accent-color);
        }

        header h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 900;
        }

        .developer-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid var(--accent-color);
            color: #a5b4fc;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            gap: 15px;
            flex: 1;
        }

        @media (min-width: 992px) {
            .main-container { flex-direction: row; }
        }

        .player-section {
            flex: 2;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 15px;
            height: fit-content;
        }

        .media-container {
            position: relative;
            padding-top: 56.25%;
            background: #000;
            width: 100%;
        }

        /* تحجيم الشاشة الكاملة ودعم الوضع الأفقي */
        .media-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            padding-top: 0;
        }

        .media-container:fullscreen {
            width: 100vw;
            height: 100vh;
            padding-top: 0;
        }

        .video-js, iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        .current-info {
            padding: 12px 18px;
            background: var(--card-bg);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .info-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .current-info img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
        }

        .fullscreen-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .channels-section {
            flex: 1;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            max-height: 78vh;
            overflow-y: auto;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .channel-card {
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .channel-card.active {
            border-color: var(--accent-color);
            background: linear-gradient(145deg, #312e81, #1e1b4b);
        }

        .channel-card img {
            width: 100%;
            height: 60px;
            object-fit: contain;
        }

        .channel-card span {
            font-size: 0.8rem;
            font-weight: 700;
        }

        footer {
            text-align: center;
            padding: 12px;
            background: #090d16;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: auto;
        }
    </style>

        const webview = document.getElementById('webview');

        const channelsList = document.getElementById('channels-list');
        const currentImg = document.getElementById('current-img');
        const currentTitle = document.getElementById('current-title');

        const player = videojs('my-video');

        function loadChannel(channel) {
            currentTitle.textContent = channel.name;
            currentImg.src = channel.logo;
            currentImg.style.display = 'block';

            document.querySelectorAll('.channel-card').forEach(card => card.classList.remove('active'));
            document.getElementById(`channel-${channel.id}`).classList.add('active');

            webview.style.display = 'none';
            player.el().style.display = 'block';
            player.pause();

            let targetUrl = channel.url;
            if (targetUrl.startsWith('http://')) {
                targetUrl = targetUrl.replace('http://', 'https://');
            }

            // تشغيل جميع روابط البث المباشر (m3u8/mp4/iptv) داخل المشغل حصرياً
            if (targetUrl.includes('.m3u8') || targetUrl.includes('.mp4') || targetUrl.includes('web24iptv') || targetUrl.includes('arab-stream')) {
                player.src({ src: targetUrl, type: targetUrl.includes('.mp4') ? 'video/mp4' : 'application/x-mpegURL' });
                player.play().catch(e => console.log(e));
            } else if (targetUrl.includes('github.io')) {
                player.el().style.display = 'none';
                webview.style.display = 'block';
                webview.src = targetUrl;
            } else {
                player.src({ src: targetUrl, type: 'application/x-mpegURL' });
                player.play().catch(e => console.log(e));
            }
        }

        // قفل الشاشة على الوضع الأفقي تلقائياً عند تفعيل الشاشة الكاملة
        async function toggleFullScreen() {
            try {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (mediaContainer.requestFullscreen) {
                        await mediaContainer.requestFullscreen();
                    } else if (mediaContainer.webkitRequestFullscreen) {
                        await mediaContainer.webkitRequestFullscreen();
                    }

                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(e => console.log(e));
                    }
                } else {
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        await document.webkitExitFullscreen();
                    }

                    if (screen.orientation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }
                }
            } catch (err) {
                console.log(err);
            }
        }

        channels.forEach(channel => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.id = `channel-${channel.id}`;
            card.innerHTML = `
                <img src="${channel.logo}" alt="${channel.name}" onerror="this.src='https://via.placeholder.com/150?text=TV'">
                <span>${channel.name}</span>
            `;
            card.onclick = () => loadChannel(channel);
            channelsList.appendChild(card);
        });

        if (channels.length > 0) loadChannel(channels[0]);
