<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Abd TV</title>

    <!-- إعدادات التثبيت كـ PWA وتدعم أندرويد و iOS (أيفون) والأيقونة المطلوبة -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Abd TV">
    <link rel="apple-touch-icon" href="https://i.ibb.co/fY1t1K5z/Abd-TV-2-8-apk-icon.png">
    <link rel="manifest" href='data:application/manifest+json;charset=utf-8,{"name":"Abd TV","short_name":"Abd TV","start_url":"./","display":"standalone","background_color":"%23C8102E","theme_color":"%23C8102E","icons":[{"src":"https://i.ibb.co/fY1t1K5z/Abd-TV-2-8-apk-icon.png","sizes":"192x192","type":"image/png"},{"src":"https://i.ibb.co/fY1t1K5z/Abd-TV-2-8-apk-icon.png","sizes":"512x512","type":"image/png"}]}'>

    <!-- مكتبات التسريع ودعم كافة صيغ البث في العالم (HLS, DASH, FLV) -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flv.js@latest/dist/flv.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none;
            user-select: none;
        }

        *:focus {
            outline: none !important;
        }

        input {
            user-select: text;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #C8102E;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            height: 55px;
            background-color: #C8102E;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            color: white;
            z-index: 10;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            display: none;
        }

        .app-title {
            font-size: 18px;
            font-weight: bold;
        }

        .search-container {
            display: flex;
            align-items: center;
        }

        .search-input {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.95);
            outline: none;
            font-size: 14px;
            width: 150px;
            transition: width 0.3s ease;
            color: #333;
        }

        .content-frame {
            flex: 1;
            position: relative;
            padding: 8px 12px 12px 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: calc(100% - 55px);
        }

        /* مؤشر التحميل الدائري البسيط الأصلي */
        .page-loader {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: block;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .list-view {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .card-item {
            background-color: #ffffff;
            border-radius: 10px;
            border: 2.5px solid #900000;
            display: flex;
            align-items: center;
            padding: 0 14px;
            height: 52px;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .card-item:active {
            background-color: #ececec;
            transform: scale(0.98);
        }

        .card-img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            margin-left: 10px;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #900000;
            flex: 1;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* حاوية المشغل الرئيسي */
        #playerSection {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .artplayer-container {
            width: 100%;
            height: 100%;
            min-height: 220px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="top-bar">
        <div class="header-left">
            <button id="backBtn" class="back-btn" onclick="goBack()">⬅</button>
            <div id="appTitle" class="app-title">Abd TV</div>
        </div>
        <div class="search-container" id="searchBox">
            <input type="text" id="searchView" class="search-input" placeholder="ابحث هنا...">
        </div>
    </div>

    <div class="content-frame">
        <div id="progressBar" class="page-loader"></div>

        <!-- قائمة العناصر -->
        <div id="listView" class="list-view"></div>

        <!-- قسم المشغل الأساسي السريع -->
        <div id="playerSection">
            <div class="artplayer-container" id="artplayer"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAXV3LcnXpWxuT6MJwh1q-i5eERjCbhrI",
            databaseURL: "https://appp-1e19d-default-rtdb.firebaseio.com",
            storageBucket: "appp-1e19d.firebasestorage.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let a_list = [];
        let filtered_list = [];
        let currentCategory = null;
        let isPlayerActive = false;
        let art = null;
        let activeHls = null;

        const listView = document.getElementById('listView');
        const playerSection = document.getElementById('playerSection');
        const progressBar = document.getElementById('progressBar');
        const searchView = document.getElementById('searchView');
        const searchBox = document.getElementById('searchBox');
        const backBtn = document.getElementById('backBtn');
        const appTitle = document.getElementById('appTitle');

        // ==================== تشغيل المشغل فائق السرعة لدعم جميع الصيغ (تم تحسين السرعة لفتح البث فوراً) ====================
        function openPlayer(url, title) {
            closePlayer(); // تنظيف أي بث سابق لمنع استمرار الصوت والتعليق

            isPlayerActive = true;
            listView.style.display = 'none';
            searchBox.style.display = 'none';
            playerSection.style.display = 'flex';

            backBtn.style.display = 'block';
            appTitle.textContent = title;

            // تحديد نوع البث تلقائياً
            let streamType = 'auto';
            if (url.includes('.m3u8')) streamType = 'm3u8';
            else if (url.includes('.mpd')) streamType = 'mpd';
            else if (url.includes('.flv')) streamType, streamType = 'flv';

            art = new Artplayer({
                container: '#artplayer',
                url: url,
                title: title,
                type: streamType,
                autoplay: true,
                isLive: true,
                fullscreen: true,
                fullscreenWeb: true,
                pip: true,
                setting: true,
                playbackRate: true,
                aspectRatio: true,
                theme: '#C8102E',
                customType: {
                    // 1. محرك HLS فائق السرعة مع ضبط Buffer الأدنى لفتح القناة بدون أي انتظار
                    m3u8: function (video, url) {
                        if (Hls.isSupported()) {
                            if (activeHls) activeHls.destroy();
                            const hls = new Hls({
                                maxBufferLength: 4,          // تقليل حجم البافر لسرعة فورية بالفتح
                                maxMaxBufferLength: 10,
                                enableWorker: true,           // تسريع المعالجة عبر المعالج الخلفي
                                lowLatencyMode: true,         // تفعيل وضع البث الفوري منخفض التأخير
                                liveSyncDurationCount: 2,     // مزامنة فورية مع البث المباشر
                                liveMaxLatencyDurationCount: 5
                            });
                            hls.loadSource(url);
                            hls.attachMedia(video);
                            activeHls = hls;
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = url;
                        }
                    },
                    // 2. محرك MPEG-DASH
                    mpd: function (video, url) {
                        const player = dashjs.MediaPlayer().create();
                        player.initialize(video, url, true);
                    },
                    // 3. محرك FLV Stream
                    flv: function (video, url) {
                        if (flvjs.isSupported()) {
                            const flvPlayer = flvjs.createPlayer({ type: 'flv', url: url });
                            flvPlayer.attachMediaElement(video);
                            flvPlayer.load();
                            flvPlayer.play();
                        }
                    }
                },
            });

            setTimeout(() => {
                if (art && art.resize) art.resize();
            }, 50);

            art.on('fullscreen', (isFull) => {
                if (isFull) {
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(() => {});
                    }
                } else {
                    if (screen.orientation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }
                }
            });
        }

        // إغلاق المشغل وتنظيف الذاكرة بالكامل لحل مشكلة استمرار الصوت أو البث في الخلفية
        function closePlayer() {
            if (activeHls) {
                activeHls.destroy();
                activeHls = null;
            }

            if (art) {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
                art.pause();
                art.destroy(true); // تدمير كلي شامل للمحرك
                art = null;
            }

            isPlayerActive = false;
            playerSection.style.display = 'none';
            searchBox.style.display = 'flex';
            listView.style.display = 'flex';

            if (currentCategory) {
                appTitle.textContent = currentCategory;
                backBtn.style.display = 'block';
            } else {
                appTitle.textContent = "Abd TV";
                backBtn.style.display = 'none';
            }
        }

        window.addEventListener('resize', () => {
            if (art && isPlayerActive && art.resize) {
                art.resize();
            }
        });

        function goBack() {
            if (isPlayerActive) {
                closePlayer();
            } else if (currentCategory !== null) {
                currentCategory = null;
                appTitle.textContent = "Abd TV";
                backBtn.style.display = 'none';
                populateMainList();
            }
        }

        // ==================== وظائف جلب البيانات والتصفية ====================
        function parseItemName(item) {
            if (!item) return "بدون اسم";
            return item.name || item.Name || item.title || item.Title || "بدون اسم";
        }

        function parseItemImage(item) {
            if (!item || typeof item !== 'object') return "";
            return item.image || item.Image || item.img || "";
        }

        function parseItemUrl(item) {
            if (!item || typeof item !== 'object') return "";
            return item.url || item.Url || item.link || "";
        }

        function renderList() {
            listView.innerHTML = '';
            filtered_list.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card-item';

                const imgUrl = parseItemImage(item).trim();
                if (imgUrl !== '') {
                    const img = document.createElement('img');
                    img.className = 'card-img';
                    img.src = imgUrl;
                    img.onerror = function() { this.style.display = 'none'; };
                    card.appendChild(img);
                }

                const title = document.createElement('div');
                title.className = 'card-title';
                title.textContent = parseItemName(item);
                card.appendChild(title);

                card.onclick = function() {
                    const isCategory = item && item.is_category && (item.is_category === true || item.is_category === "true");
                    if (isCategory) {
                        currentCategory = parseItemName(item);
                        appTitle.textContent = currentCategory;
                        backBtn.style.display = 'block';
                        filterByCategory(currentCategory);
                    } else {
                        const targetUrl = parseItemUrl(item);
                        if (targetUrl) {
                            openPlayer(targetUrl, parseItemName(item));
                        } else {
                            alert("رابط البث غير متوفر!");
                        }
                    }
                };

                listView.appendChild(card);
            });
        }

        function filterByCategory(catName) {
            filtered_list = a_list.filter(item => {
                if (!item) return false;
                const isCat = item.is_category && (item.is_category === true || item.is_category === "true");
                if (isCat) return false;
                const itemCategory = item.category || item.Category || "عام";
                return itemCategory.toString().trim() === catName.trim();
            });
            renderList();
        }

        function populateMainList() {
            if (currentCategory !== null) return;
            filtered_list = a_list.filter(item => {
                if (!item) return false;
                const isCategory = item.is_category && (item.is_category === true || item.is_category === "true");
                const categoryVal = item.category || item.Category || "";
                const hasCategory = categoryVal.toString().trim() !== "";
                return isCategory || !hasCategory;
            });
            renderList();
        }

        const dbRef = database.ref('abdo');
        dbRef.on('value', (snapshot) => {
            a_list = [];
            const val = snapshot.val();
            if (val) {
                Object.keys(val).forEach(key => {
                    a_list.push(val[key]);
                });
            }
            if (currentCategory === null && !isPlayerActive) {
                populateMainList();
            }
            if (progressBar) progressBar.style.display = 'none';
        });

        searchView.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query === "") {
                if (currentCategory) filterByCategory(currentCategory);
                else populateMainList();
            } else {
                filtered_list = a_list.filter(item => {
                    if (!item) return false;
                    const itemName = parseItemName(item).toLowerCase();
                    return itemName.includes(query);
                });
            }
            renderList();
        });
    </script>
</body>
</html>
