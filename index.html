<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البث المباشر</title>
<link href="https://vjs.zencdn.net/7.20.3/video-js.min.css" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .video-js {
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>

<video-js id="live" class="vjs-default-skin vjs-big-play-centered" controls autoplay muted playsinline>
  <source src="https://live.paltodaytv.com/paltv/live/playlist_sfm4s.m3u8" type="application/x-mpegURL">
</video-js>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
  var player = videojs('live', {
    autoplay: true,
    controls: true,
    fluid: false,
    fill: true,
    liveui: true
  });
  player.play();
</script>

</body>
</html>
